kind = "web"
previewPath = "/"
title = "Roman Academy Dashboard"
version = "1.0.0"
id = "artifacts/roman-academy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23492

[services.development]
run = "pnpm --filter @workspace/roman-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roman-academy", "run", "build" ]
publicDir = "artifacts/roman-academy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23492"
BASE_PATH = "/"
