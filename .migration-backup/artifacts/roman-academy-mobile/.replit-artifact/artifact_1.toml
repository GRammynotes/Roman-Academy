kind = "mobile"
previewPath = "/mobile/"
title = "Roman Academy Mobile"
version = "1.0.0"
id = "artifacts/roman-academy-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23549

[services.development]
run = "pnpm --filter @workspace/roman-academy-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roman-academy-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/roman-academy-mobile", "run", "serve" ]

[services.env]
PORT = "23549"
BASE_PATH = "/mobile/"
